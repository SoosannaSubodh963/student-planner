<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List · Student Task Planner</title>
<meta name="description" content="Student Task Planner – To-Do List">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/student.css">
</head>
<body data-role="student" data-page="todo" data-base="../" data-title="To-Do List" data-sub="Your simple daily checklist">
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="grid row-main">
        <div>
          <div class="card mb-20"><form class="todo-add" id="addForm" novalidate><input type="text" id="todoText" placeholder="What do you need to do today?" maxlength="140" aria-label="New to-do item" autocomplete="off"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus"></i> Add</button></form><small class="field-error" id="addErr"></small></div>
          <div class="flex between center wrap mb-20"><div class="pills" id="pills"></div><button class="btn btn-secondary btn-sm" id="clearDone" type="button"><i class="fa-solid fa-broom"></i> Clear completed</button></div>
          <div id="todoList"></div>
        </div>
        <div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-chart-simple"></i> Today's progress</div></div><div class="progress-wrap"><div class="ring" id="ring"><span id="ringText">0%</span></div><div class="legend-list" id="legend"></div></div></div>
      </div>
    </main>
  </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script src="../js/todo.js"></script>
</body>
</html>
