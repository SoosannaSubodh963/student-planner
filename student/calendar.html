<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Student Task Planner</title>
<meta name="description" content="Student Task Planner – Calendar">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/student.css">
</head>
<body data-role="student" data-page="calendar" data-base="../" data-title="Calendar" data-sub="Your deadlines at a glance">
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="cal-layout">
        <div class="card">
          <div class="cal-head">
            <div class="cal-nav"><button class="icon-btn" id="prevBtn" type="button" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button><h2 id="monthTitle"></h2><button class="icon-btn" id="nextBtn" type="button" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button></div>
            <div class="flex gap-8"><button class="btn btn-secondary btn-sm" id="todayBtn" type="button"><i class="fa-solid fa-crosshairs"></i> Today</button><button class="btn btn-primary btn-sm" id="addBtn" type="button"><i class="fa-solid fa-plus"></i> Add Task</button></div>
          </div>
          <div class="cal-dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend"><span style="--c:var(--danger)">High priority</span><span style="--c:var(--warning)">Medium</span><span style="--c:var(--success)">Low</span><span style="--c:var(--purple-2)">Assignment</span></div>
        </div>
        <div>
          <div class="card mb-20"><div class="card-header"><div><div class="card-title"><i class="fa-solid fa-calendar-day"></i> <span id="dayTitle"></span></div><div class="card-sub" id="daySub"></div></div><button class="btn btn-primary btn-sm" id="addDayBtn" type="button"><i class="fa-solid fa-plus"></i> Add task</button></div><div id="dayList"></div></div>
          <div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-hourglass-half"></i> Upcoming deadlines</div></div><div class="list" id="upcoming"></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script src="../js/calendar.js"></script>
</body>
</html>
