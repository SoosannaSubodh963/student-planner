<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Tasks · Student Task Planner</title>
<meta name="description" content="Student Task Planner – Manage Tasks">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-role="admin" data-page="tasks" data-base="../" data-title="Manage Tasks" data-sub="Monitor tasks created by all students (read-only)">
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="stat-grid" id="stats"></div>
      <div class="toolbar">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Search tasks…" aria-label="Search tasks…"></div>
        <select id="fStudent" aria-label="Filter by student"></select>
        <select id="fSubject" aria-label="Filter by subject"></select>
        <select id="fPriority" aria-label="Filter by priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
        <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option><option value="Open">Open (not completed)</option><option>Pending</option><option>In Progress</option><option>Completed</option><option>Overdue</option></select>
        <button class="btn btn-ghost" id="clearBtn" type="button"><i class="fa-solid fa-filter-circle-xmark"></i> Clear</button>
      </div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Task</th><th>Student</th><th>Subject</th><th>Priority</th><th>Due date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div id="emptyBox"></div>
    </main>
  </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script src="../js/admin-tasks.js"></script>
</body>
</html>
