<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Students · Student Task Planner</title>
<meta name="description" content="Student Task Planner – Manage Students">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body data-role="admin" data-page="students" data-base="../" data-title="Manage Students" data-sub="View, edit and control student accounts">
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="main-wrap">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="stat-grid" id="stats"></div>
      <div class="toolbar">
        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Search by name, ID or email…" aria-label="Search by name, ID or email…"></div>
        <select id="fDept" aria-label="Filter by department"></select>
        <select id="fSem" aria-label="Filter by semester"></select>
        <select id="fStatus" aria-label="Filter by account status"><option value="">All accounts</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
        <button class="btn btn-ghost" id="clearBtn" type="button"><i class="fa-solid fa-filter-circle-xmark"></i> Clear</button>
      </div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Student ID</th><th>Name</th><th>Email</th><th>Department</th><th>Semester</th><th>Registered</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div id="emptyBox"></div>
    </main>
  </div>
</div>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script src="../js/manage-students.js"></script>
</body>
</html>
